<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felix 앱 체험판</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{--page:#DCE6F2;--ink:#0F1B2D;--note:#33445A}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}


button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #1570EF;outline-offset:2px}
a{color:#1570EF}a:hover{color:#0B4FB3}

#stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:20px;padding-inline:16px;box-sizing:border-box}
#app>div{max-width:100%;height:min(844px,calc(100vh - 96px))!important;border-radius:28px;box-shadow:0 12px 40px rgba(15,27,45,.18)}
#hint{font-size:13px;color:var(--note);text-align:center;max-width:390px}
@media (max-width:480px){
#stage{padding:0;gap:0;justify-content:flex-start}
#app{width:100%}
#app>div{width:100%!important;height:100dvh!important;border-radius:0;box-shadow:none}
#hint{display:none}
}
</style>
</head>
<body>
<div id="stage"><div id="app"></div><div id="hint">Felix 체험판입니다. 미국 주별, 일본 수출입, 한국 수입 통관, 비철, 환율 등은 Felix 서버에서 실제 값을 불러오고, 서버에 연결되지 않은 곳에서는 예시 값으로 표시합니다. 뉴스·투표·평가가는 예시입니다.</div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #F4F7FB; color: #0F1B2D; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 12px; background: #FFFFFF; border-bottom: 1px solid #E3EAF3">
    <div style="font-size: 17px; font-weight: 700; letter-spacing: 1.5px; color: #1570EF">FELIX</div>
    <div style="font-size: 12px; font-weight: 600; color: #7A4B00; background: #FFF3D6; border-radius: 12px; padding: 3px 10px">목업 · 일부 예시 값</div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto">

    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 28px">
        <div>
          <div style="font-size: 13px; color: #55657A">2026년 10월 5일 월요일</div>
          <h1 style="margin: 2px 0 0; font-size: 22px; font-weight: 700; line-height: 1.35">이번 주 철강 시장</h1>
        </div>

        <button onClick="{{ openReport }}" style="display: block; width: 100%; box-sizing: border-box; background: #1570EF; color: #FFFFFF; border-radius: 14px; padding: 16px 18px">
          <div style="font-size: 12px; font-weight: 600; opacity: 0.9">주간 리포트 제12호 · 10월 1주</div>
          <div style="margin-top: 6px; font-size: 16px; font-weight: 600; line-height: 1.5">중국 내수가는 판재 중심으로 내렸고 코크스만 올랐다. 수입재 하락 압력은 이어지고, 환율이 그 폭을 일부 상쇄한다.</div>
          <div style="margin-top: 10px; font-size: 13px; font-weight: 600">리포트 읽기 →</div>
        </button>

        <div style="background: #FFFFFF; border: 1px solid #E3EAF3; border-radius: 14px; padding: 14px 16px">
          <div style="font-size: 13px; font-weight: 700; color: #55657A">크게 움직인 항목 · 실제 발표값 기준</div>
          <sc-for list="{{ movers }}" as="m" hint-placeholder-count="3">
            <button onClick="{{ m.open }}" style="display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #EEF2F7; margin-top: 8px; padding-top: 8px">
              <div>
                <div style="font-size: 15px; font-weight: 600">{{ m.name }}</div>
                <div style="font-size: 12px; color: #55657A">{{ m.groupLabel }} · {{ m.valText }} {{ m.unit }}</div>
              </div>
              <div style="font-size: 16px; font-weight: 700; {{ m.chgStyle }}">{{ m.pctText }}</div>
            </button>
          </sc-for>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #E3EAF3; border-radius: 14px; padding: 14px 16px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <div style="font-size: 13px; font-weight: 700; color: #55657A">내 관심 품목</div>
            <button onClick="{{ goBoard }}" style="min-height: 44px; font-size: 13px; font-weight: 600; color: #1570EF">전체 시세</button>
          </div>
          <sc-for list="{{ watchItems }}" as="w" hint-placeholder-count="3">
            <button onClick="{{ w.open }}" style="display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #EEF2F7; padding: 6px 0">
              <div>
                <div style="font-size: 15px; font-weight: 600">{{ w.name }}</div>
                <div style="font-size: 12px; color: #55657A">{{ w.groupLabel }}</div>
              </div>
              <div style="text-align: right">
                <div style="font-size: 15px; font-weight: 700">{{ w.valText }}</div>
                <div style="font-size: 12px; font-weight: 600; {{ w.chgStyle }}">{{ w.chgText }}</div>
              </div>
            </button>
          </sc-for>
          <sc-if value="{{ noWatch }}" hint-placeholder-val="{{ false }}">
            <div style="font-size: 14px; color: #55657A; padding: 10px 0">시세 탭에서 항목을 열고 관심 품목에 추가하세요.</div>
          </sc-if>
        </div>

        <div style="background: #E8F2FF; border-radius: 14px; padding: 16px 18px">
          <div style="font-size: 15px; font-weight: 700">국내 유통가 칸은 아직 비어 있습니다</div>
          <div style="margin-top: 4px; font-size: 14px; color: #33445A">공개된 숫자로는 방향만 알 수 있습니다. 이번 주 체감을 5초 투표로 알려 주세요.</div>
          <button onClick="{{ goTips }}" style="margin-top: 12px; min-height: 44px; padding: 0 18px; border-radius: 22px; background: #1570EF; color: #FFFFFF; font-size: 14px; font-weight: 600">이번 주 방향 투표하기</button>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #E3EAF3; border-radius: 14px; padding: 14px 16px">
          <div style="font-size: 13px; font-weight: 700; color: #55657A">다가오는 일정</div>
          <div style="display: flex; gap: 12px; margin-top: 10px">
            <div style="width: 58px; font-size: 13px; font-weight: 700; color: #1570EF">10월 14일경</div>
            <div style="flex: 1; font-size: 14px">중국 국가통계국 10월 상순 생산재 가격 발표</div>
          </div>
          <div style="display: flex; gap: 12px; margin-top: 10px">
            <div style="width: 58px; font-size: 13px; font-weight: 700; color: #1570EF">10월 15일경</div>
            <div style="flex: 1; font-size: 14px">관세청 9월 품목별 수출입 실적 공개. 수입 통관 단가 9개 항목 갱신</div>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isBoard }}" hint-placeholder-val="{{ false }}">
      <div style="padding: 18px 0 28px">
        <div style="padding: 0 20px">
          <h1 style="margin: 0; font-size: 22px; font-weight: 700">시세</h1>
          <div style="font-size: 13px; color: #55657A">공개 데이터 44개 항목 · 8개 그룹</div>
        </div>
        <div style="display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 6px">
          <sc-for list="{{ groups }}" as="g" hint-placeholder-count="5">
            <button onClick="{{ g.pick }}" style="flex: none; min-height: 44px; padding: 0 16px; border-radius: 22px; font-size: 14px; font-weight: 600; white-space: nowrap; {{ g.style }}">{{ g.label }}</button>
          </sc-for>
        </div>

        <sc-if value="{{ isDataGroup }}" hint-placeholder-val="{{ true }}">
          <div style="margin: 8px 20px 0; background: #FFFFFF; border: 1px solid #E3EAF3; border-radius: 14px; padding: 4px 16px 6px">
            <div style="display: flex; justify-content: space-between; gap: 10px; padding: 12px 0 8px; font-size: 12px; color: #55657A">
              <div>{{ groupSrc }} · {{ groupCycle }} 갱신</div>
              <div style="font-weight: 600; {{ groupTagStyle }}">{{ groupTag }}</div>
            </div>
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
              <button onClick="{{ r.open }}" style="display: flex; width: 100%; min-height: 56px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #EEF2F7; padding: 6px 0">
                <div>
                  <div style="font-size: 15px; font-weight: 600">{{ r.name }}</div>
                  <div style="font-size: 12px; color: #55657A">{{ r.unit }}</div>
                </div>
                <div style="text-align: right">
                  <div style="font-size: 16px; font-weight: 700">{{ r.valText }}</div>
                  <div style="font-size: 12px; font-weight: 600; {{ r.chgStyle }}">{{ r.chgText }}</div>
                </div>
              </button>
            </sc-for>
          </div>
          <div style="margin: 10px 20px 0; font-size: 12px; color: #55657A">기준: {{ groupDate }}. {{ groupNote }}</div>
        </sc-if>

        <sc-if value="{{ isCmpGroup }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 6px; margin: 8px 20px 0; background: #E6ECF4; border-radius: 12px; padding: 4px">
            <sc-for list="{{ cmpTabs }}" as="ct" hint-placeholder-count="3">
              <button onClick="{{ ct.pick }}" aria-pressed="{{ ct.on }}" style="flex: 1; min-height: 44px; border-radius: 9px; font-size: 13px; font-weight: 700; text-align: center; {{ ct.style }}">{{ ct.label }}</button>
            </sc-for>
          </div>
          <div style="margin: 10px 20px 0; background: #FFFFFF; border: 1px solid #E3EAF3; border-radius: 14px; padding: 12px 12px 8px">
            <div style="font-size: 15px; font-weight: 700; padding: 0 4px">{{ cmpTitle }}</div>
            <div style="font-size: 12px; color: #55657A; padding: 2px 4px 10px">변동률로 비교합니다. 단위와 기준 기간이 달라 가격 수준은 비교하지 않습니다. 표는 옆으로 밀어 볼 수 있습니다.</div>
            <div style="overflow-x: auto">
              <div style="min-width: 590px">
                <div style="display: grid; grid-template-columns: 60px repeat(8, minmax(56px, 1fr)); gap: 4px; align-items: end; padding-bottom: 6px; border-bottom: 1px solid #E3EAF3">
                  <div></div>
                  <sc-for list="{{ cmpCols }}" as="cc0" hint-placeholder-count="8">
                    <div style="text-align: center"><div style="font-size: 13px; font-weight: 700">{{ cc0.name }}</div><div style="font-size: 10.5px; color: #55657A">{{ cc0.sub }}</div></div>
                  </sc-for>
                </div>
                <sc-for list="{{ cmpRows }}" as="cr" hint-placeholder-count="5">
                  <div style="display: grid; grid-template-columns: 60px repeat(8, minmax(56px, 1fr)); gap: 4px; align-items: center; border-bottom: 1px solid #EEF2F7">
                    <div style="font-size: 13px; font-weight: 700; padding-left: 4px">{{ cr.name }}</div>
                    <sc-for list="{{ cr.cells }}" as="cc" hint-placeholder-count="8">
                      <button onClick="{{ cc.open }}" aria-label="{{ cc.label }}" style="min-height: 52px; border-radius: 8px; text-align: center; padding: 4px 2px; {{ cc.boxStyle }}">
                        <div style="font-size: 13px; font-weight: 700; {{ cc.mainStyle }}">{{ cc.main }}</div>
                        <div style="font-size: 10.5px; color: #55657A">{{ cc.sub }}</div>
                      </button>
                    </sc-for>
                  </div>
                </sc-for>
              </div>
            </div>
          </div>
          <div style="margin: 10px 20px 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #33445A">
            <div>한국: 철강 제품은 한국은행 생산자물가지수(KOSIS, 2020=100), 원료·비철은 관세청 수입 통관 단가(달러/t)의 전월 대비입니다.</div>
            <div>미국: 노동통계국 생산자물가지수(1982=100), 자동 갱신. 후판·형강 칸은 봉강·후판·형강을 합친 지수입니다. 열연강판은 2022년 2월, 선재는 2017년, 철근은 2013년에 발표가 중단됐습니다.</div>
            <div>중국: 국가통계국 유통 단계 가격(위안/t), 직전 열흘 대비, 자동 갱신. 냉연·도금·스테인리스, 철광석, 스크랩, 니켈은 조사 품목이 아닙니다.</div>
            <div>인도: 경제자문관실 품목별 도매물가지수. 철강 품목 구성과 재사용 약관을 확인하지 못했습니다.</div>
            <div>멕시코: INEGI 생산자물가지수(상업적 이용 가능). 철근 값은 INEGI를 인용한 건설업협회 자료이고, 나머지는 원자료 연동 전입니다.</div>
            <div>일본: 재무성 무역통계(e-Stat) 단가(엔/t)의 전월 대비. 철강 제품·스크랩·구리는 수출, 원료와 나머지 비철은 수입 단가입니다. 아래 달러 값은 관세청 과세환율 월평균 환산 참고치입니다. 일본은행 기업물가지수는 상업적 이용에 사전 상담이 필요해 쓰지 않습니다.</div>
            <div>유럽: Eurostat는 출처를 밝히면 상업적 이용이 가능합니다(EU 회원국 데이터 한정). 품목별 지수는 독일 연방통계청에 있으나 이용 조건을 확인하지 못했습니다.</div>
            <div>세계: 세계은행 월평균 가격(CC BY 4.0), 7월 대비. 제품 가격은 다루지 않습니다.</div>
          </div>
        </sc-if>

        <sc-if value="{{ isUsGroup }}" hint-placeholder-val="{{ false }}">
          <div style="margin: 8px 20px 0; border-radius: 12px; padding: 10px 12px; font-size: 12px; {{ usBannerStyle }}">
            <div>{{ usBanner }}</div>
            <sc-if value="{{ usShowRetry }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ usRetry }}" style="margin-top: 6px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #7A4B00; font-size: 13px; font-weight: 600">다시 불러오기</button>
            </sc-if>
          </div>
          <div style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 20px 4px">
            <sc-for list="{{ usStates }}" as="us" hint-placeholder-count="8">
              <button onClick="{{ us.pick }}" aria-pressed="{{ us.on }}" style="flex: none; min-height: 44px; padding: 0 14px; border-radius: 22px; font-size: 14px; font-weight: 600; white-space: nowrap; {{ us.style }}">{{ us.label }}</button>
            </sc-for>
          </div>
          <div style="margin: 8px 20px 0">
            <div style="font-size: 15px; font-weight: 700">{{ usStateName }} 도착 수입품의 해상·항공 수입 단가</div>
            <div style="font-size: 12px; color: #55657A">기준 월: {{ usMonthLabel }} · 단위: 달러/t · 출처: 미국 인구조사국</div>
          </div>
          <sc-for list="{{ usSections }}" as="sec" hint-placeholder-count="3">
            <div style="margin: 10px 20px 0; background: #FFFFFF; border: 1px solid #E3EAF3; border-radius: 14px; padding: 4px 16px 6px">
              <div style="padding: 10px 0 4px; font-size: 13px; font-weight: 700; color: #55657A">{{ sec.label }}</div>
              <sc-for list="{{ sec.rows }}" as="ur" hint-placeholder-count="4">
                <div style="display: flex; min-height: 56px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #EEF2F7">
                  <div>
                    <div style="font-size: 15px; font-weight: 600">{{ ur.name }}</div>
                    <div style="font-size: 12px; color: #55657A">HS {{ ur.hs }} · <span style="font-weight: 700; {{ ur.tagStyle }}">{{ ur.tag }}</span></div>
                  </div>
                  <div style="text-align: right">
                    <div style="font-size: 16px; font-weight: 700; {{ ur.valStyle }}">{{ ur.valText }}</div>
                    <div style="font-size: 12px; font-weight: 600; {{ ur.chgStyle }}">{{ ur.chgText }}</div>
                  </div>
                </div>
              </sc-for>
            </div>
          </sc-for>
          <div style="margin: 10px 20px 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #33445A">
            <div>해상·항공 수입 단가 = (해상 수입액 + 항공 수입액) ÷ (해상 + 항공 운송 중량) × 1,000. 전체 수입액은 분자에 쓰지 않습니다.</div>
            <div>중량은 순중량이 아니라 포장 등을 포함한 운송 중량(shipping weight) 기준입니다.</div>
            <div>운송 중량이 100t 미만인 달은 소수 거래가 단가를 좌우하므로 값을 회색으로 표시하고 ‘물량 적음’을 붙입니다. 전월이 이 경우면 변동률을 계산하지 않습니다.</div>
            <div>트럭·철도로 들어온 수입분(주로 캐나다·멕시코산)은 계산에 포함되지 않습니다.</div>
            <div>주는 생산지가 아니라 수입품이 도착한 주입니다.</div>
            <div>출처: U.S. Census Bureau, International Trade, State Imports by HS. 중량이 0이거나 자료가 없으면 ‘자료 없음’으로 표시합니다.</div>
            <div style="font-style: italic">This product uses the Census Bureau Data API but is not endorsed or certified by the Census Bureau.</div>
          </div>
        </sc-if>

        <sc-if value="{{ isKrGroup }}" hint-placeholder-val="{{ false }}">
          <div style="margin: 8px 20px 0; border-radius: 12px; padding: 10px 12px; font-size: 12px; {{ krBannerStyle }}">
            <div>{{ krBanner }}</div>
            <sc-if value="{{ krShowRetry }}" hint-placeholder-val="{{ false }}">
              <button onClick="{{ krRetry }}" style="margin-top: 6px; min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #7A4B00; font-size: 13px; font-weight: 600">다시 불러오기</button>
            </sc-if>
          </div>
          <div style="margin: 12px 20px 0">
            <div style="font-size: 15px; font-weight: 700">{{ krTitle }}</div>
            <div style="font-size: 12px; color: #55657A">기준 월: {{ krMonthLabel }} · 단위: 달러/t · 출처: 관세청</div>
          </div>
          <div style="margin: 10px 20px 0; background: #FFFFFF; border: 1px solid #E3EAF3; border-radius: 14px; padding: 4px 16px 6px">
            <sc-for list="{{ krRows }}" as="kr" hint-placeholder-count="9">
              <div style="display: flex; min-height: 64px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #EEF2F7; padding: 6px 0">
                <div>
                  <div style="font-size: 15px; font-weight: 600">{{ kr.name }}</div>
                  <div style="font-size: 12px; font-weight: 700; {{ kr.tagStyle }}">{{ kr.tag }}</div>
                  <div style="font-size: 12px; color: #33445A">{{ kr.origin }}</div>
                  <div style="font-size: 11.5px; color: #55657A">{{ kr.partners }}</div>
                </div>
                <div style="text-align: right">
                  <div style="font-size: 16px; font-weight: 700; {{ kr.valStyle }}">{{ kr.valText }}</div>
                  <div style="font-size: 12px; font-weight: 600; {{ kr.chgStyle }}">{{ kr.chgText }}</div>
                </div>
              </div>
            </sc-for>
          </div>
