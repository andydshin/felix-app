<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felix · 철강 시세</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--page:#F2F4F7;--ink:#0B0D12;--note:#344054}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Inter', 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif}


button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #0072F5;outline-offset:2px}
a{color:#0072F5}a:hover{color:#0058CC}

#stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:20px;padding-inline:16px;box-sizing:border-box}
#app>div{max-width:100%;height:min(844px,calc(100vh - 96px))!important;border-radius:28px;box-shadow:0 12px 40px rgba(16,24,40,.10)}
#hint{font-size:13px;color:var(--note);text-align:center;max-width:390px}
@media (max-width:480px){
#stage{padding:0;gap:0;justify-content:flex-start}
#app{width:100%}
#app>div{width:100%!important;height:100dvh!important;border-radius:0;box-shadow:none}
#hint{display:none}
}
</style>
</head>
<body>
<div id="stage"><div id="app"></div><div id="hint">Felix · 세계 철강 시세와 시장 분석</div></div>
<template id="tpl">

<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #0B0D12; font-family: 'Inter', 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; letter-spacing: -0.01em; font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 12px; background: #FFFFFF; border-bottom: 1px solid #EAECF0">
    <div style="display: flex; align-items: center; gap: 8px"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" style="fill: #EEF6FF; stroke: #0072F5; stroke-opacity: 0.5"></rect><path d="M6 16 L10 11 L13 13.5 L18 7" style="fill: none; stroke: #0072F5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path></svg><div style="font-size: 16px; font-weight: 700; letter-spacing: 0.18em; color: #0B0D12">FELIX</div></div>
    <div style="display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #667085; border: 1px solid #EAECF0; border-radius: 12px; padding: 3px 10px"><span style="width: 6px; height: 6px; border-radius: 3px; background: #12B76A"></span>BETA</div>
  </div>

  <div style="flex: 1; min-height: 0; overflow-y: auto">

    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 28px">
        <div>
          <div style="font-size: 13px; color: #667085">{{ todayLabel }}</div>
          <h1 style="margin: 2px 0 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.35">이번 주 철강 시장</h1>
        </div>

        <button onClick="{{ openReport }}" style="display: block; width: 100%; box-sizing: border-box; text-align: left; background: linear-gradient(135deg, #EEF6FF 0%, #FFFFFF 70%); border: 1px solid #CFE3FF; color: #0B0D12; border-radius: 16px; padding: 20px">
          <div style="font-size: 12px; font-weight: 600; color: #0072F5; letter-spacing: 0.02em">{{ homeRepTag }}</div>
          <div style="margin-top: 8px; font-size: 17px; font-weight: 600; line-height: 1.5">{{ homeRepLine }}</div>
          <div style="margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #0072F5">{{ homeRepCta }} <span aria-hidden="true">→</span></div>
        </button>

        <div style="background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 16px">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><div style="font-size: 15px; font-weight: 700">가격 방향 신호 <span style="font-size: 12px; font-weight: 500; color: #98A2B3">향후 1~3개월</span></div><div style="font-size: 11px; color: #98A2B3">{{ sg.meta }}</div></div>
          <sc-if value="{{ sg.hasHead }}" hint-placeholder-val="{{ true }}">
            <div style="margin-top: 10px; background: #F5F8FF; border-radius: 12px; padding: 12px">
              <div style="font-size: 14px; font-weight: 600; line-height: 1.5; color: #0B0D12">{{ sg.head }}</div>
              <sc-if value="{{ sg.hasWhy }}" hint-placeholder-val="{{ true }}"><div style="margin-top: 6px; font-size: 12.5px; line-height: 1.5; color: #344054">{{ sg.why }}</div></sc-if>
              <div style="margin-top: 2px; font-size: 12px; line-height: 1.5; color: #98A2B3">{{ sg.basis }}</div>
            </div>
          </sc-if>
          <div style="margin-top: 6px">
            <sc-for list="{{ sg.rows }}" as="sr" hint-placeholder-count="6">
              <button onClick="{{ sr.open }}" style="display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; padding: 9px 0; border-top: 1px solid #F2F4F7">
                <div style="flex: none; width: 4px; align-self: stretch; border-radius: 2px; {{ sr.stripe }}"></div>
                <div style="flex: 1; min-width: 0">
                  <div style="font-size: 15px; font-weight: 700">{{ sr.name }}</div>
                  <div style="margin-top: 1px; font-size: 12px; line-height: 1.4; color: #667085; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ sr.brief }}</div>
                </div>
                <div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px">
                  <span style="font-size: 12px; font-weight: 700; border-radius: 7px; padding: 2px 8px; {{ sr.chip }}">{{ sr.level }}</span>
                  <div style="display: flex; gap: 2px"><sc-for list="{{ sr.meter }}" as="mc" hint-placeholder-count="5"><div style="width: 9px; height: 4px; border-radius: 2px; {{ mc.style }}"></div></sc-for></div>
                </div>
              </button>
            </sc-for>
          </div>
          <div style="margin-top: 6px; padding-top: 8px; border-top: 1px solid #F2F4F7; font-size: 11px; line-height: 1.55; color: #98A2B3">{{ sg.note }}</div>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 14px 16px">
          <div style="font-size: 13px; font-weight: 700; color: #667085">크게 움직인 항목 · 직전 발표 대비</div>
          <sc-for list="{{ movers }}" as="m" hint-placeholder-count="3">
            <button onClick="{{ m.open }}" style="display: flex; width: 100%; min-height: 60px; align-items: center; gap: 12px; border-top: 1px solid #F2F4F7; margin-top: 8px; padding-top: 8px">
              <div style="flex: 1; min-width: 0">
                <div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.name }}</div>
                <div style="font-size: 12px; color: #667085; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.groupLabel }} · <span style="font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ m.valText }}</span> {{ m.unit }}</div>
                <sc-if value="{{ m.hasWhy }}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; font-weight: 600; color: #0058CC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.whyLine }}</div></sc-if>
              </div>
              <sc-if value="{{ m.hasSpark }}" hint-placeholder-val="{{ true }}">
                <svg viewBox="0 0 64 24" width="64" height="24" style="flex: none" role="img" aria-label="{{ m.sparkLabel }} 추이"><polyline points="{{ m.spark }}" style="fill: none; stroke: {{ m.sparkColor }}; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round"></polyline></svg>
              </sc-if>
              <div style="flex: none; min-width: 64px; text-align: right; white-space: nowrap; font-size: 16px; font-weight: 700; {{ m.chgStyle }}; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ m.pctText }}</div>
            </button>
          </sc-for>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 14px 16px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <div style="font-size: 13px; font-weight: 700; color: #667085">내 관심 품목</div>
            <button onClick="{{ goBoard }}" style="min-height: 44px; font-size: 13px; font-weight: 600; color: #0072F5">전체 시세</button>
          </div>
          <sc-for list="{{ watchItems }}" as="w" hint-placeholder-count="3">
            <button onClick="{{ w.open }}" style="display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #F2F4F7; padding: 6px 0">
              <div>
                <div style="font-size: 15px; font-weight: 600">{{ w.name }}</div>
                <div style="font-size: 12px; color: #667085">{{ w.groupLabel }}</div>
              </div>
              <div style="text-align: right">
                <div style="font-size: 15px; font-weight: 700; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ w.valText }}</div>
                <div style="font-size: 12px; font-weight: 600; {{ w.chgStyle }}; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ w.chgText }}</div>
              </div>
            </button>
          </sc-for>
          <sc-if value="{{ noWatch }}" hint-placeholder-val="{{ false }}">
            <div style="font-size: 14px; color: #667085; padding: 10px 0">시세 탭에서 항목을 열고 관심 품목에 추가하세요.</div>
          </sc-if>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 14px 16px">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><div style="font-size: 13px; font-weight: 700; color: #667085">이번 주 유통 현장 체감</div><div style="font-size: 11px; color: #98A2B3">{{ vh.meta }}</div></div>
          <sc-for list="{{ vh.rows }}" as="vh1" hint-placeholder-count="3">
            <div style="display: grid; grid-template-columns: 64px 1fr 100px; gap: 10px; align-items: center; margin-top: 10px">
              <div style="font-size: 14px; font-weight: 600">{{ vh1.name }}</div>
              <div style="display: flex; height: 8px; border-radius: 4px; overflow: hidden; background: #F2F4F7"><div style="{{ vh1.upBar }}"></div><div style="{{ vh1.flatBar }}"></div><div style="{{ vh1.downBar }}"></div></div>
              <div style="text-align: right; font-size: 12px; font-weight: 700; white-space: nowrap; {{ vh1.style }}">{{ vh1.text }}</div>
            </div>
          </sc-for>
          <div style="margin-top: 10px; font-size: 12px; color: #667085">{{ vh.note }}</div>
          <button onClick="{{ goTips }}" style="margin-top: 10px; min-height: 40px; padding: 0 16px; border-radius: 20px; background: #0072F5; color: #FFFFFF; font-size: 14px; font-weight: 600">5초 투표하기</button>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 14px 16px">
          <div style="font-size: 13px; font-weight: 700; color: #667085">다가오는 발표</div>
          <sc-for list="{{ upcoming }}" as="up" hint-placeholder-count="3">
            <div style="display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: baseline; margin-top: 12px">
              <div style="white-space: nowrap"><span style="font-size: 15px; font-weight: 700; color: #0072F5; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ up.md }}</span><div style="font-size: 11px; color: #98A2B3">{{ up.wd }}요일 경</div></div>
              <div><div style="font-size: 14px; font-weight: 600">{{ up.title }}</div><div style="font-size: 12px; color: #667085">{{ up.why }}</div></div>
            </div>
          </sc-for>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isBoard }}" hint-placeholder-val="{{ false }}">
      <div style="padding: 18px 0 28px">
        <div style="padding: 0 20px">
          <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">시세</h1>
          <div style="font-size: 13px; color: #667085">공개 데이터 · 나라별 내수·수출·수입과 국제 시세</div>
        </div>
        <button onClick="{{ openHs }}" style="display: flex; margin: 12px 20px 0; width: calc(100% - 40px); box-sizing: border-box; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; border-radius: 14px; border: 1px solid #CFE3FF; background: #EEF6FF; padding: 0 16px">
          <div style="text-align: left"><div style="font-size: 14px; font-weight: 700; color: #0058CC">HS 코드로 무역 통계 검색</div><div style="font-size: 12px; color: #344054">예: 멕시코의 중국산·한국산 석도강판 수입 물량·단가</div></div>
          <span style="font-size: 16px; color: #0058CC">→</span>
        </button>
        <div style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 14px 20px 0">
          <sc-for list="{{ cats }}" as="ca" hint-placeholder-count="8">
            <button onClick="{{ ca.pick }}" style="min-width: 0; min-height: 36px; border-radius: 10px; text-align: center; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px; {{ ca.style }}">{{ ca.label }}</button>
          </sc-for>
        </div>
        <sc-if value="{{ isNation }}" hint-placeholder-val="{{ false }}">
          <div style="margin: 12px 20px 0; padding: 12px; border-radius: 14px; background: #F7F9FC; border: 1px solid #EEF1F5">
            <div style="display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px">
              <sc-for list="{{ nats }}" as="na" hint-placeholder-count="7">
                <button onClick="{{ na.pick }}" style="min-width: 0; min-height: 34px; border-radius: 9px; text-align: center; font-size: 12.5px; font-weight: 600; white-space: nowrap; padding: 0; {{ na.style }}">{{ na.label }}</button>
              </sc-for>
            </div>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin-top: 10px; background: #EAECF0; border-radius: 10px; padding: 3px">
              <sc-for list="{{ flows }}" as="fl" hint-placeholder-count="3">
                <button onClick="{{ fl.pick }}" aria-pressed="{{ fl.on }}" style="min-height: 34px; border-radius: 8px; text-align: center; font-size: 13px; font-weight: 700; {{ fl.style }}">{{ fl.label }}</button>
              </sc-for>
            </div>
            <sc-if value="{{ hasFlowNote }}" hint-placeholder-val="{{ false }}"><div style="margin-top: 8px; font-size: 11.5px; color: #98A2B3">{{ flowNote }}</div></sc-if>
            <sc-if value="{{ hasNatHint }}" hint-placeholder-val="{{ false }}"><button onClick="{{ goUsImp }}" style="display: flex; width: 100%; margin-top: 8px; align-items: center; justify-content: space-between; min-height: 40px; padding: 0 12px; border-radius: 10px; background: #EEF6FF; color: #0058CC; font-size: 12.5px; font-weight: 600; text-align: left"><span>{{ natHint }}</span><span aria-hidden="true">→</span></button></sc-if>
          </div>
        </sc-if>

        <sc-if value="{{ isDataGroup }}" hint-placeholder-val="{{ true }}">
          <div style="margin: 8px 20px 0; background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 4px 16px 6px">
            <div style="display: flex; justify-content: space-between; gap: 10px; padding: 12px 0 8px; font-size: 12px; color: #667085">
              <div>{{ groupSrc }} · {{ groupCycle }} 갱신</div>
              <div style="font-weight: 600; {{ groupTagStyle }}">{{ groupTag }}</div>
            </div>
            <sc-for list="{{ rows }}" as="r" hint-placeholder-count="8">
              <button onClick="{{ r.open }}" style="display: flex; width: 100%; min-height: 56px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #F2F4F7; padding: 6px 0">
                <div>
                  <div style="font-size: 15px; font-weight: 600">{{ r.name }}</div>
                  <div style="font-size: 12px; color: #667085">{{ r.unit }}</div>
                </div>
                <div style="text-align: right">
                  <div style="font-size: 16px; font-weight: 700; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ r.valText }}</div>
                  <div style="font-size: 12px; font-weight: 600; {{ r.chgStyle }}; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ r.chgText }}</div>
                </div>
              </button>
            </sc-for>
          </div>
          <div style="margin: 10px 20px 0; font-size: 12px; color: #667085">기준: {{ groupDate }}. {{ groupNote }}</div>
        </sc-if>

        <sc-if value="{{ isKrDom }}" hint-placeholder-val="{{ false }}">
          <div style="margin: 14px 20px 0; background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 4px 16px 6px">
            <div style="display: flex; justify-content: space-between; gap: 10px; padding: 12px 0 8px; font-size: 12px; color: #667085"><div style="font-size: 13px; font-weight: 700; color: #344054">수급 지표</div><div>{{ sdNote }}</div></div>
            <sc-for list="{{ sdRows }}" as="r" hint-placeholder-count="3">
              <button onClick="{{ r.open }}" style="display: flex; width: 100%; min-height: 56px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #F2F4F7; padding: 6px 0">
                <div><div style="font-size: 15px; font-weight: 600">{{ r.name }}</div><div style="font-size: 12px; color: #667085">{{ r.unit }}</div></div>
                <div style="text-align: right"><div style="font-size: 16px; font-weight: 700; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ r.valText }}</div><div style="font-size: 12px; font-weight: 600; {{ r.chgStyle }}; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ r.chgText }}</div></div>
              </button>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ isLive }}" hint-placeholder-val="{{ false }}">
          <div style="margin: 8px 20px 0; border-radius: 12px; padding: 10px 12px; font-size: 12px; {{ lv.bannerStyle }}">{{ lv.banner }}</div>
          <div style="margin: 12px 20px 0"><div style="font-size: 15px; font-weight: 700">{{ lv.title }}</div><div style="font-size: 12px; color: #667085">{{ lv.src }}</div></div>
          <div style="margin: 10px 20px 0; background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 4px 16px 6px">
            <sc-for list="{{ lv.rows }}" as="lr" hint-placeholder-count="8">
              <div style="display: flex; min-height: 56px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #F2F4F7; padding: 6px 0">
                <div style="min-width: 0"><div style="font-size: 15px; font-weight: 600">{{ lr.name }}</div><div style="font-size: 12px; color: #667085; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{ lr.sub }}</div></div>
                <div style="flex: none; text-align: right"><div style="font-size: 16px; font-weight: 700; {{ lr.valStyle }}; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ lr.valText }}</div><div style="font-size: 12px; font-weight: 600; {{ lr.chgStyle }}; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ lr.chgText }}</div></div>
              </div>
            </sc-for>
          </div>
          <div style="margin: 10px 20px 0; display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #667085"><sc-for list="{{ lv.notes }}" as="ln" hint-placeholder-count="2"><div>{{ ln }}</div></sc-for></div>
        </sc-if>

        <sc-if value="{{ isCmpGroup }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; gap: 6px; margin: 8px 20px 0; background: #F2F4F7; border-radius: 12px; padding: 4px">
            <sc-for list="{{ cmpTabs }}" as="ct" hint-placeholder-count="3">
              <button onClick="{{ ct.pick }}" aria-pressed="{{ ct.on }}" style="flex: 1; min-height: 44px; border-radius: 9px; font-size: 13px; font-weight: 700; text-align: center; {{ ct.style }}">{{ ct.label }}</button>
            </sc-for>
          </div>
          <div style="margin: 10px 20px 0; background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 16px">
            <div style="font-size: 15px; font-weight: 700">{{ cmpTitle }}</div>
            <div style="font-size: 12px; color: #667085; margin-top: 2px">나라마다 가격 기준과 단위가 달라, 직전 발표 대비 변동률로 비교합니다.</div>
            <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px">
              <sc-for list="{{ cmpItems }}" as="ci" hint-placeholder-count="6">
                <button onClick="{{ ci.pick }}" aria-pressed="{{ ci.on }}" style="min-height: 36px; padding: 0 12px; border-radius: 18px; font-size: 13px; font-weight: 600; {{ ci.style }}">{{ ci.name }}</button>
              </sc-for>
            </div>
            <div style="margin-top: 12px">
              <sc-for list="{{ cmpList }}" as="cl" hint-placeholder-count="8">
                <button onClick="{{ cl.open }}" aria-label="{{ cl.label }}" style="display: flex; width: 100%; min-height: 56px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #F2F4F7; padding: 8px 0">
                  <div>
                    <div style="font-size: 15px; font-weight: 600">{{ cl.name }}</div>
                    <div style="font-size: 12px; color: #667085">{{ cl.colSub }}</div>
                  </div>
                  <div style="text-align: right">
                    <div style="font-size: 15px; font-weight: 700; {{ cl.mainStyle }}">{{ cl.main }}</div>
