<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Felix · 철강 시세</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{--page:#F2F4F7;--ink:#0B0D12;--note:#344054}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:'Inter', 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif}


button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0;text-align:left}
input{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid #0072F5;outline-offset:2px}
a{color:#0072F5}a:hover{color:#0058CC}

#stage{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding-block:20px;padding-inline:16px;box-sizing:border-box}
#app>div{max-width:100%;height:min(844px,calc(100vh - 96px))!important;border-radius:28px;box-shadow:0 12px 40px rgba(16,24,40,.10)}
#hint{font-size:13px;color:var(--note);text-align:center;max-width:390px}
@media (max-width:480px){
#stage{padding:0;gap:0;justify-content:flex-start}
#app{width:100%}
#app>div{width:100%!important;height:100dvh!important;border-radius:0;box-shadow:none}
#hint{display:none}
}
</style>
</head>
<body>
<div id="stage"><div id="app"></div><div id="hint">Felix · 세계 철강 시세와 시장 분석</div></div>
<template id="tpl">

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: #FFFFFF; color: #0B0D12; font-family: 'Inter', 'Pretendard Variable', Pretendard, -apple-system, 'Apple SD Gothic Neo', sans-serif; letter-spacing: -0.01em; font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums; overflow: hidden">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px 12px; background: #FFFFFF; border-bottom: 1px solid #EAECF0">
    <div style="display: flex; align-items: center; gap: 8px"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="1" y="1" width="22" height="22" rx="6" style="fill: #EEF6FF; stroke: #0072F5; stroke-opacity: 0.5"></rect><path d="M6 16 L10 11 L13 13.5 L18 7" style="fill: none; stroke: #0072F5; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"></path></svg><div style="font-size: 16px; font-weight: 700; letter-spacing: 0.18em; color: #0B0D12">FELIX</div></div>
    <div style="display: flex; align-items: center; gap: 8px">
      <sc-if value="{{ authed }}" hint-placeholder-val="{{ true }}">
        <sc-if value="{{ isPro }}" hint-placeholder-val="{{ false }}"><span style="font-size: 11px; font-weight: 800; letter-spacing: 0.04em; border-radius: 8px; padding: 3px 8px; background: #0B1F3F; color: #FFFFFF">PRO</span></sc-if>
        <button onClick="{{ nt2.open }}" aria-label="알림" style="position: relative; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: #344054">
          <svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg>
          <sc-if value="{{ nt2.hasUnread }}" hint-placeholder-val="{{ true }}"><span style="position: absolute; top: 4px; right: 3px; min-width: 17px; height: 17px; box-sizing: border-box; padding: 0 4px; border-radius: 9px; border: 2px solid #FFFFFF; background: #F04452; color: #FFFFFF; font-size: 10px; font-weight: 800; line-height: 13px; text-align: center">{{ nt2.unread }}</span></sc-if>
        </button>
      </sc-if>
      <sc-if value="{{ guest }}" hint-placeholder-val="{{ false }}">
        <button onClick="{{ openLogin }}" style="min-height: 34px; padding: 0 14px; border-radius: 17px; background: #0072F5; color: #FFFFFF; font-size: 13px; font-weight: 700">로그인</button>
      </sc-if>
    </div>
  </div>
  <sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; top: 74px; left: 20px; right: 20px; z-index: 30; padding: 12px 16px; border-radius: 14px; background: rgba(11,13,18,0.88); color: #FFFFFF; font-size: 14px; font-weight: 600; text-align: center; box-shadow: 0 8px 24px rgba(16,24,40,0.2)">{{ toastText }}</div>
  </sc-if>

  <div style="flex: 1; min-height: 0; overflow-y: auto">

    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 28px">
        <div>
          <div style="font-size: 13px; color: #667085">{{ todayLabel }}</div>
          <h1 id="home-h1" style="margin: 2px 0 0; font-size: 20px; font-weight: 700; letter-spacing: -0.035em; line-height: 1.35; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">철강 시세, 어디로 움직이고 있을까요?</h1>
        </div>

        <sc-for list="{{ tg.hits }}" as="th" hint-placeholder-count="0">
          <div style="display: flex; align-items: center; gap: 10px; background: #ECFDF3; border: 1px solid #ABEFC6; border-radius: 14px; padding: 12px 12px 12px 14px">
            <button onClick="{{ th.open }}" style="flex: 1; min-width: 0; text-align: left"><div style="font-size: 12px; font-weight: 700; color: #067647">목표가 도달</div><div style="font-size: 14px; font-weight: 700">{{ th.text }}</div><div style="font-size: 12px; color: #475467">{{ th.sub }}</div></button>
            <button onClick="{{ th.dismiss }}" aria-label="닫기" style="flex: none; min-width: 32px; min-height: 32px; font-size: 18px; color: #475467; text-align: center">×</button>
          </div>
        </sc-for>

        <sc-if value="{{ authed }}" hint-placeholder-val="{{ true }}">
        <div style="border-radius: 20px; padding: 18px; background: linear-gradient(135deg, #0058CC 0%, #0072F5 55%, #3D9BFF 100%); color: #FFFFFF">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
            <div style="min-width: 0">
              
              <div style="display: flex; align-items: flex-start; gap: 8px; font-size: 18px; font-weight: 700; line-height: 1.35"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" style="flex: none; margin-top: 2px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round"><path d="M4 12a8 8 0 0 1 16 0"></path><path d="M7.5 12a4.5 4.5 0 0 1 9 0"></path><circle cx="12" cy="12" r="1.6" style="fill: currentColor; stroke: none"></circle></svg><span>출근길, 귀로 듣는<br>핵심 시황</span></div>
              <div style="display: flex; align-items: center; gap: 6px; margin-top: 4px; padding-left: 28px; font-size: 12px; opacity: 0.85"><sc-if value="{{ radio.locked }}" hint-placeholder-val="{{ false }}"><span style="font-size: 10px; font-weight: 800; border-radius: 6px; padding: 1px 6px; background: #FFFFFF; color: #0058CC">PRO</span></sc-if><span>{{ radio.meta }}</span></div>
            </div>
            <button onClick="{{ radio.main }}" aria-label="{{ radio.mainLabel }}" style="flex: none; width: 60px; height: 60px; border-radius: 30px; background: #FFFFFF; color: #0072F5; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px rgba(0,40,100,0.25)">
              <sc-if value="{{ radio.playing }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.2" style="fill: currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1.2" style="fill: currentColor"></rect></svg></sc-if>
              <sc-if value="{{ radio.notPlaying }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.5-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z" style="fill: currentColor"></path></svg></sc-if>
            </button>
          </div>
          <sc-if value="{{ radio.unsupported }}" hint-placeholder-val="{{ false }}"><div style="margin-top: 10px; font-size: 12px; opacity: 0.9">이 브라우저에서는 음성 재생을 지원하지 않습니다.</div></sc-if>
        </div>

        </sc-if>
        <button onClick="{{ openReport }}" style="display: block; width: 100%; box-sizing: border-box; text-align: left; background: linear-gradient(135deg, #EEF6FF 0%, #FFFFFF 70%); border: 1px solid #CFE3FF; color: #0B0D12; border-radius: 16px; padding: 20px">
          <div style="font-size: 12px; font-weight: 600; color: #0072F5; letter-spacing: 0.02em">{{ homeRepTag }}</div>
          <div style="margin-top: 8px; font-size: 17px; font-weight: 600; line-height: 1.5">{{ homeRepLine }}</div>
          <div style="margin-top: 14px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #0072F5">{{ homeRepCta }} <span aria-hidden="true">→</span></div>
        </button>

        <sc-if value="{{ authed }}" hint-placeholder-val="{{ true }}">
        <div style="background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 16px">
          <div style="display: flex; justify-content: space-between; align-items: baseline; gap: 8px"><div style="font-size: 15px; font-weight: 700">앞으로의 가격 흐름 <span style="font-size: 12px; font-weight: 500; color: #98A2B3">1~3개월 전망</span></div><div style="font-size: 11px; color: #98A2B3">{{ sg.meta }}</div></div>
          <sc-if value="{{ sg.hasHead }}" hint-placeholder-val="{{ true }}">
            <div style="margin-top: 10px; background: #F5F8FF; border-radius: 12px; padding: 12px">
              <div style="font-size: 14px; font-weight: 600; line-height: 1.5; color: #0B0D12">{{ sg.head }}</div>
              <sc-if value="{{ sg.hasWhy }}" hint-placeholder-val="{{ true }}"><div style="margin-top: 6px; font-size: 12.5px; line-height: 1.5; color: #344054">{{ sg.why }}</div></sc-if>
              <div style="margin-top: 2px; font-size: 12px; line-height: 1.5; color: #98A2B3">{{ sg.basis }}</div>
            </div>
          </sc-if>
          <div style="margin-top: 6px">
            <sc-for list="{{ sg.rows }}" as="sr" hint-placeholder-count="6">
              <button onClick="{{ sr.open }}" style="display: flex; width: 100%; align-items: center; gap: 10px; text-align: left; padding: 9px 0; border-top: 1px solid #F2F4F7">
                <div style="flex: none; width: 4px; align-self: stretch; border-radius: 2px; {{ sr.stripe }}"></div>
                <div style="flex: 1; min-width: 0">
                  <div style="font-size: 15px; font-weight: 700">{{ sr.name }}</div>
                  <div style="margin-top: 1px; font-size: 12px; line-height: 1.4; color: #667085; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ sr.brief }}</div>
                </div>
                <div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 5px">
                  <span style="font-size: 12px; font-weight: 700; border-radius: 7px; padding: 2px 8px; {{ sr.chip }}">{{ sr.level }}</span>
                  <div style="display: flex; gap: 2px"><sc-for list="{{ sr.meter }}" as="mc" hint-placeholder-count="5"><div style="width: 9px; height: 4px; border-radius: 2px; {{ mc.style }}"></div></sc-for></div>
                </div>
              </button>
            </sc-for>
          </div>
          <div style="margin-top: 6px; padding-top: 8px; border-top: 1px solid #F2F4F7; font-size: 11px; line-height: 1.55; color: #98A2B3">{{ sg.note }}</div>
          <button onClick="{{ openTrack }}" style="align-self: flex-start; min-height: 36px; font-size: 13px; font-weight: 600; color: #0072F5">지난 전망·예측 정확도 보기 →</button>
        </div>

        </sc-if>
        <div style="background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 14px 16px">
          <div style="display: flex; justify-content: space-between; align-items: center"><div style="font-size: 13px; font-weight: 700; color: #667085">가장 크게 변한 숫자들 · 직전 대비</div><button onClick="{{ shareSummary }}" style="display: flex; align-items: center; gap: 4px; min-height: 30px; padding: 0 10px; border-radius: 15px; background: #EEF6FF; color: #0058CC; font-size: 12px; font-weight: 700"><svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round"><path d="M12 15V3"></path><path d="M7 8l5-5 5 5"></path><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"></path></svg>공유</button></div>
          <sc-for list="{{ movers }}" as="m" hint-placeholder-count="3">
            <button onClick="{{ m.open }}" style="display: flex; width: 100%; min-height: 60px; align-items: center; gap: 12px; border-top: 1px solid #F2F4F7; margin-top: 8px; padding-top: 8px">
              <div style="flex: 1; min-width: 0">
                <div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.name }}</div>
                <div style="font-size: 12px; color: #667085; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.groupLabel }} · <span style="font-family: 'JetBrains Mono', 'Pretendard Variable', monospace; {{ m.skV }}">{{ m.valText }}</span> {{ m.unitShort }}</div>
                <sc-if value="{{ m.hasWhy }}" hint-placeholder-val="{{ false }}"><div style="font-size: 12px; font-weight: 600; color: #0058CC; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ m.whyLine }}</div></sc-if>
              </div>
              <sc-if value="{{ m.hasSpark }}" hint-placeholder-val="{{ true }}">
                <svg viewBox="0 0 64 24" width="64" height="24" style="flex: none" role="img" aria-label="{{ m.sparkLabel }} 추이"><polyline points="{{ m.spark }}" style="fill: none; stroke: {{ m.sparkColor }}; stroke-width: 1.6; stroke-linejoin: round; stroke-linecap: round"></polyline></svg>
              </sc-if>
              <div style="flex: none; min-width: 64px; text-align: right; white-space: nowrap"><div style="font-size: 16px; font-weight: 700; {{ m.chgStyle }}; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ m.pctText }}</div><div style="margin-top: 2px; display: inline-block; font-size: 10.5px; font-weight: 600; color: #667085; background: #F2F4F7; border-radius: 6px; padding: 1px 6px">{{ m.per }}</div></div>
            </button>
          </sc-for>
        </div>
        <sc-if value="{{ guest }}" hint-placeholder-val="{{ false }}">
          <div style="border-radius: 20px; padding: 20px; background: #F5F8FF; border: 1px solid #DCE8FF">
            <div style="font-size: 18px; font-weight: 700; line-height: 1.4">로그인하고 전체 시세를 보세요</div>
            <div style="margin-top: 6px; font-size: 13px; line-height: 1.6; color: #475467">무료로 가입하면 아래 기능을 바로 쓸 수 있습니다.</div>
            <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px; font-size: 14px; color: #0B0D12">
              <div>✓ 8개국 철강·원료·비철 시세와 환율</div>
              <div>✓ 가격 방향 신호와 주간 리포트</div>
              <div>✓ 관심 품목, 리포트 발행 알림</div>
            </div>
            <button onClick="{{ openLogin }}" style="margin-top: 16px; width: 100%; min-height: 50px; border-radius: 25px; background: #0072F5; color: #FFFFFF; font-size: 15px; font-weight: 700; text-align: center">3초 만에 시작하기</button>
          </div>
        </sc-if>
        <sc-if value="{{ authed }}" hint-placeholder-val="{{ true }}">

        <div style="background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 14px 16px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <div style="font-size: 13px; font-weight: 700; color: #667085">내가 챙겨보는 지표</div>
            <button onClick="{{ goBoard }}" style="min-height: 44px; font-size: 13px; font-weight: 600; color: #0072F5">전체 시세</button>
          </div>
          <sc-for list="{{ watchItems }}" as="w" hint-placeholder-count="3">
            <button onClick="{{ w.open }}" style="display: flex; width: 100%; min-height: 52px; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #F2F4F7; padding: 6px 0">
              <div>
                <div style="font-size: 15px; font-weight: 600">{{ w.name }}</div>
                <div style="font-size: 12px; color: #667085">{{ w.groupLabel }}</div>
              </div>
              <div style="text-align: right">
                <div style="font-size: 15px; font-weight: 700; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace; {{ w.skV }}">{{ w.valText }}</div>
                <div style="font-size: 12px; font-weight: 600; {{ w.chgStyle }}; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ w.chgText }}</div>
              </div>
            </button>
          </sc-for>
          <sc-if value="{{ noWatch }}" hint-placeholder-val="{{ false }}">
            <div style="font-size: 14px; color: #667085; padding: 10px 0">시세 탭에서 항목을 열고 관심 품목에 추가하세요.</div>
          </sc-if>
        </div>

        <div style="background: #FFFFFF; border: 1px solid #EAECF0; border-radius: 16px; padding: 14px 16px">
          <div style="font-size: 13px; font-weight: 700; color: #667085">앞으로 나올 주요 지표</div>
          <sc-for list="{{ upcoming }}" as="up" hint-placeholder-count="3">
            <div style="display: grid; grid-template-columns: 52px 1fr; gap: 12px; align-items: baseline; margin-top: 12px">
              <div style="white-space: nowrap"><span style="font-size: 15px; font-weight: 700; color: #0072F5; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ up.md }}</span><div style="font-size: 11px; color: #98A2B3">{{ up.wd }}요일(예정)</div></div>
              <div><div style="font-size: 14px; font-weight: 600">{{ up.title }}</div><div style="font-size: 12px; color: #667085">{{ up.why }}</div></div>
            </div>
          </sc-for>
        </div>
        </sc-if>
      </div>
    </sc-if>

    <sc-if value="{{ isGate }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 14px; padding: 18px 20px 28px">
        <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">{{ gate.title }}</h1>
        <div style="position: relative; border-radius: 18px; overflow: hidden; border: 1px solid #EAECF0">
          <div style="padding: 14px 16px; filter: blur(4px); opacity: 0.55">
            <sc-for list="{{ gate.preview }}" as="gp" hint-placeholder-count="5">
              <div style="display: flex; justify-content: space-between; min-height: 52px; align-items: center; border-top: 1px solid #F2F4F7"><div><div style="font-size: 15px; font-weight: 600">{{ gp.a }}</div><div style="font-size: 12px; color: #667085">{{ gp.b }}</div></div><div style="font-size: 16px; font-weight: 700; font-family: 'JetBrains Mono', 'Pretendard Variable', monospace">{{ gp.c }}</div></div>
            </sc-for>
          </div>
          <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: linear-gradient(180deg, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0.92) 60%); padding: 20px; text-align: center">
            <div style="width: 48px; height: 48px; border-radius: 24px; background: #EEF6FF; color: #0072F5; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round"><rect x="4" y="11" width="16" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg></div>
            <div style="font-size: 17px; font-weight: 700">{{ gate.head }}</div>
            <div style="font-size: 13px; line-height: 1.6; color: #475467">{{ gate.body }}</div>
            <button onClick="{{ openLogin }}" style="margin-top: 4px; min-height: 48px; padding: 0 28px; border-radius: 24px; background: #0072F5; color: #FFFFFF; font-size: 15px; font-weight: 700">로그인하고 보기</button>
          </div>
        </div>
      </div>
    </sc-if>

    <sc-if value="{{ isBoard }}" hint-placeholder-val="{{ false }}">
      <div style="padding: 18px 0 28px">
        <div style="padding: 0 20px">
          <h1 style="margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -0.02em">시세</h1>
          <div style="font-size: 13px; color: #667085">국가별 내수·수출입 가격부터 원료·환율까지 한눈에</div>
        </div>
        <button onClick="{{ openHs }}" style="display: flex; margin: 12px 20px 0; width: calc(100% - 40px); box-sizing: border-box; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; border-radius: 14px; border: 1px solid #CFE3FF; background: #EEF6FF; padding: 0 16px">
          <div style="text-align: left"><div style="font-size: 14px; font-weight: 700; color: #0058CC">HS 코드로 글로벌 무역 데이터 찾기</div><div style="font-size: 12px; color: #344054">예: 멕시코의 중국산·한국산 석도강판 수입 물량·단가</div></div>
          <span style="font-size: 16px; color: #0058CC">→</span>
        </button>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 20px 0">
